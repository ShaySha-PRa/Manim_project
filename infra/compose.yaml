services:
  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      MANIM_WORKBENCH_DATABASE_URL: sqlite:////data/manim_workbench.db
      MANIM_WORKBENCH_INTERNAL_TOKEN: ${MANIM_WORKBENCH_INTERNAL_TOKEN:-}
      MANIM_WORKBENCH_REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - api-data:/data
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

volumes:
  api-data:
  redis-data:
